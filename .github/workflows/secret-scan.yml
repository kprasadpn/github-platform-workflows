name: Secret Scan Template

# Gitleaks-based scan. Note: GitHub's native secret scanning (Settings ->
# Security -> Code security and analysis) also runs automatically and needs
# no workflow. This one is useful as an explicit PR check / for repos
# without GHAS licensing on private repos.

on:
  workflow_call:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
